var COL = {channel:'#f2c14e', tag:'#59c1f0', post:'#6ee7a8', post_tt:'#c79bf0', post_nv:'#f08c8c'};
var isPost = function(gr){ return gr.indexOf('post')===0; };

// 글 → 채널 매핑 (엣지에서 계산)
var chanOf = {};
G.links.forEach(function(l){ if(l.type==='chan') chanOf[l.source] = l.target; });

var nodes = new vis.DataSet(G.nodes.map(function(n){
  return {
    id:n.id, label:n.label, group:n.group, value:(n.size||6),
    title: n.title || n.label,
    color: COL[n.group] || '#888',
    font:{color:'#dce8f7', size:(n.group==='channel'?17:(n.group==='tag'?13:11))},
    _url: n.url || '', _raw: n
  };
}));
var edges = new vis.DataSet(G.links.map(function(l){
  return {from:l.source, to:l.target, _t:l.type,
    color:{color:(l.type==='chan'?'#3d4e6d':'#22314d')},
    width:(l.type==='chan'?1.4:0.7)};
}));
var net = new vis.Network(document.getElementById('net'),
  {nodes:nodes, edges:edges},
  {interaction:{hover:true, tooltipDelay:130},
   physics:{stabilization:{iterations:240},
     barnesHut:{gravitationalConstant:-13000, springLength:135, springConstant:0.03, damping:0.62}},
   nodes:{scaling:{min:4,max:34}}});

// 채널 필터 칩
var chanNodes = G.nodes.filter(function(n){return n.group==='channel';});
var chips = document.getElementById('chips');
var active = {};
chanNodes.forEach(function(c){
  active[c.id] = true;
  var d = document.createElement('div');
  d.className = 'chip on'; d.textContent = c.label; d.dataset.id = c.id;
  d.onclick = function(){ active[c.id] = !active[c.id];
    d.classList.toggle('on', active[c.id]); d.classList.toggle('dim', !active[c.id]); apply(); };
  chips.appendChild(d);
});

function apply(){
  var q = document.getElementById('q').value.trim().toLowerCase();
  var visPost = {}, visTag = {};
  G.nodes.forEach(function(n){
    if(isPost(n.group)){
      var okCh = active[chanOf[n.id]] !== false;
      var okQ  = !q || (n.label||'').toLowerCase().indexOf(q) >= 0
                      || (n.title||'').toLowerCase().indexOf(q) >= 0;
      if(okCh && okQ) visPost[n.id] = true;
    }
  });
  G.links.forEach(function(l){
    if(l.type==='tag' && visPost[l.source]) visTag[l.target] = true;
  });
  var upd = [];
  G.nodes.forEach(function(n){
    var show;
    if(isPost(n.group)) show = !!visPost[n.id];
    else if(n.group==='tag') show = q ? !!visTag[n.id] : true;
    else show = true;
    upd.push({id:n.id, hidden:!show});
  });
  nodes.update(upd);
  document.getElementById('stat').textContent =
    '글 '+Object.keys(visPost).length+' / 전체 '+
    G.nodes.filter(function(n){return isPost(n.group);}).length+
    ' · 태그 '+G.nodes.filter(function(n){return n.group==='tag';}).length+
    ' · 연결 '+G.links.length;
}
document.getElementById('q').oninput = apply;

net.on('click', function(p){
  var box = document.getElementById('info');
  if(!p.nodes.length){ box.style.display='none'; return; }
  var n = nodes.get(p.nodes[0]);
  if(n._url){
    box.style.display='block';
    box.innerHTML = '🔗 <b>'+n.title+'</b><br><a href="'+n._url+
      '" target="_blank" rel="noopener">'+n._url+'</a>';
  } else {
    box.style.display='block';
    box.innerHTML = (n.group==='tag'?'🏷️ 주제: ':'📡 채널: ')+'<b>'+n.label+'</b>';
  }
});
apply();
